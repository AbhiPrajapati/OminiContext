server.port=${SERVER_PORT:8085}

# Spring Data MongoDB Configuration — externalized via env vars
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/omnicontext_db}
spring.data.mongodb.auto-index-creation=true

# Logging
logging.level.com.omnicontext=INFO
logging.level.org.springframework.data.mongodb=INFO

# LM Studio Integration (Port 1234 - OpenAI Compatible Local Server)
lmstudio.base-url=${LMSTUDIO_BASE_URL:http://localhost:1234/v1}
lmstudio.model=${LMSTUDIO_MODEL:default}
lmstudio.timeout-seconds=${LMSTUDIO_TIMEOUT:75}
lmstudio.enabled=${LMSTUDIO_ENABLED:true}

# OpenAI Integration (Takes precedence over local LM Studio when api-key is set)
# If openai.api-key is configured, local LM Studio check is skipped and requests route to OpenAI
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# AI Provider Selection: OPENAI, LOCAL_LLM, AUTO (default)
# AUTO = tries OpenAI if key is set, falls back to local LM Studio, then rule-based NLP
ai.provider=${AI_PROVIDER:AUTO}

# Application Secret Key (for future JWT signing / session encryption)
app.secret-key=${APP_SECRET_KEY:omnicontext-dev-secret-change-me}

# CORS Configuration — comma-separated allowed origins/patterns
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:8080,http://localhost:5173,https://app.omnicontext.io}

# Rate Limiting
ratelimit.compression.requests-per-minute=${RATELIMIT_COMPRESSION_RPM:10}
ratelimit.create.requests-per-minute=${RATELIMIT_CREATE_RPM:30}

# Payload Size Guard (max rawContent size in bytes, default 50KB)
payload.max-raw-content-bytes=${PAYLOAD_MAX_RAW_CONTENT_BYTES:51200}

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
