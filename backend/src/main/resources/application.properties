server.port=8085

# Spring Data MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/omnicontext_db
spring.data.mongodb.auto-index-creation=true

# Logging
logging.level.com.omnicontext=INFO
logging.level.org.springframework.data.mongodb=INFO

# LM Studio Integration (Port 1234 - OpenAI Compatible Local Server)
lmstudio.base-url=http://localhost:1234/v1
lmstudio.model=default
lmstudio.timeout-seconds=75
lmstudio.enabled=true

# OpenAI Integration (Takes precedence over local LM Studio when api-key is set)
# If openai.api-key is configured, local LM Studio check is skipped and requests route to OpenAI
openai.api-key=
openai.model=gpt-4o-mini
openai.base-url=https://api.openai.com/v1
