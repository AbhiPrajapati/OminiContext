<div class="app-layout">
  <!-- Global Top Navbar -->
  <header class="top-nav glass-panel">
    <div class="nav-content">
      <a routerLink="/" class="nav-brand">
        <span class="brand-logo-icon">⚡</span>
        <span class="brand-title">Omni<span class="gradient-text">Context</span></span>
        <span class="badge badge-violet badge-sm">AI Sync Hub</span>
      </a>

      <div class="nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          Capsules
        </a>

        <a routerLink="/editor" routerLinkActive="active" class="nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          Studio &amp; Distill
        </a>
      </div>

      <div class="nav-actions">
        <!-- Clean & Simple Theme Toggle -->
        <button 
          type="button" 
          class="theme-toggle-btn"
          (click)="toggleTheme()" 
          [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
          [title]="isDark() ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
          <div class="toggle-pill" [class.dark-active]="isDark()">
            <span class="toggle-indicator">
              @if (isDark()) {
                <svg class="theme-icon moon-icon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
              } @else {
                <svg class="theme-icon sun-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="5"></circle>
                  <line x1="12" y1="1" x2="12" y2="3"></line>
                  <line x1="12" y1="21" x2="12" y2="23"></line>
                  <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                  <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                  <line x1="1" y1="12" x2="3" y2="12"></line>
                  <line x1="21" y1="12" x2="23" y2="12"></line>
                  <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                  <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
              }
            </span>
          </div>
          <span class="theme-toggle-label">{{ isDark() ? 'Dark' : 'Light' }}</span>
        </button>

        <a routerLink="/editor" class="btn-primary btn-nav">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New Capsule
        </a>
      </div>
    </div>
  </header>

  <!-- Main View Area -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
